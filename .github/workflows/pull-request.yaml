name: Ammeter Test Framework CI

on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Pytest Suite
      run: python -m pytest tests/

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Ruff
      run: pip install ruff mypy types-PyYAML

    # Used --ignore-missing-imports to avoid changing the existing requirements.txt file
    - name: Run Linter
      run: |
        ruff check .
        mypy --ignore-missing-imports .
